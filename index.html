"“Mirëmëngjes” is what you say in the morning (mëngjes = morning). In the evening you say Mirëmbrëma, before bed Natën e mirë, and when leaving Mirupafshim.",
"“Quhem” means “I am called”. It changes with the person: unë quhem, ti quhesh, ai quhet, ata quhen.",
"“Është” means “is” for he, she or it. Unë jam = I am, ti je = you are, ata janë = they are.",
"“Pesë” is five. A few neighbours to remember: tre = 3, katër = 4, gjashtë = 6.",
"“Faleminderit” means thank you. “Të lutem” is please (or you’re welcome), “Më fal” is sorry, and “Mirë se vjen” is welcome.",
"“Si je?” means “How are you?”, so the natural answer is “Jam mirë, faleminderit” (I’m fine, thank you).",
"With “unë” you say “pi”: unë pi kafe (I drink coffee). Ata pinë = they drink, ne pimë = we drink.",
"When you talk to one person (“ti”), the verb usually ends in -n: ti banon (you live). Unë banoj, ai banon, ne banojmë, ata banojnë.",
"After “një” (a) you use the plain word: një libër. “Libri” and “librin” mean “the book”.",
"“Dje” means yesterday, so you use the form for something already finished: unë shkova. “Shkoj” = I go, “do të shkoj” = I will go.",
"“Tetë” is eight and “gjysmë” is half, so “tetë e gjysmë” is half past eight: 8:30.",
"The sentence is about “motra ime” (my sister), who is “ajo” (she), so the verb ends like this: ajo jeton. Compare unë jetoj, ti jeton.",
"“Vajzë” is a girl, and “e bukur” goes with girls and women. For a boy you say “djalë i bukur”. The little word before the adjective (i, e) depends on what you describe.",
"“Nesër” means tomorrow. To say what you will do, use “do të” + the verb: do të shkoj (I will go).",
"“Kur isha i vogël” (when I was little) talks about something you did again and again, so you say “luaja” (I used to play).",
"“Ka lexuar” means “has read”. “Ka” + “lexuar” is the usual way to say you have done something.",
"“Po vonohem” means “I’m running late”. It is a very common thing to text a friend.",
"After “nëse” (if) you use the normal present: Nëse bie shi (if it rains), do të rrimë në shtëpi (we will stay at home).",
"“Faturën, ju lutem” means “The bill, please”. “Faturë” is the bill or receipt, and “ju lutem” is the polite way to say please.",
"“Mirë” (well) tells us how he speaks. “I mirë” and “e mirë” describe a person or thing (good), not how someone does something.",
"“Po të kisha” means “if I had”, and it goes with “do të udhëtoja” (I would travel). It is the usual pattern for “if I had more time, I would…”.",
"“Të cilin” means “whom” or “that” here: njeriu të cilin takova (the man I met).",
"“Dera u mbyll” means the door closed (the wind closed it). “U” before a verb often shows that something happened to the thing.",
"“Inteligjent” and “i zgjuar” both mean clever. The other options mean careless, tired, and hungry.",
"“Kur arrita, filmi kishte filluar” means the film had already started when I arrived. “Kishte” + “filluar” shows something happened earlier.",
"“Flitet” means “is spoken”. It is the natural way to say which language is spoken where.",
"The text says the train had already left (“treni kishte ikur”) when she arrived, so she had to wait an hour. In other words, she missed it.",
"“Qenka” shows surprise: you have just noticed or found out something. “Look, it turns out to be the most beautiful town I’ve seen!”",
"“Sikur ta kishim ditur” means “if we had known”. You use it for something you wish had gone differently in the past.",
"“I përkushtuar” means devoted or dedicated. “I devotshëm” is close in meaning, while the other options are lazy, angry, and late.",
"When you tell what someone said about the future, “do të vij” becomes “do të vinte”: Ai tha se do të vinte (he said he would come).",
"“Duke” + a verb means “while doing”: duke ecur = while walking. So: Duke ecur rrugës, pashë një mik (While walking along the street, I saw a friend).",
"The usual phrase is “marr një vendim” (to make a decision). Here: ai e mori vendimin (he made the decision).",
"The text says that although many young people leave, Arbeni “vendosi të qëndronte” (decided to stay) and opened a café. So he chose to stay in town and start a business.",
"“Më ra ndër mend” means “it came to my mind”. “Ra” can also mean “fell”, but in this phrase you can’t translate word by word, so learn it as a whole.",
"“Rrofsh sa malet” literally means “may you live as long as the mountains”. People say it to thank someone warmly and to wish them a long life. Mirupafshim = goodbye, Më fal = sorry, Natën e mirë = good night.",
"After “falë” (thanks to) the next word changes its ending: falë ndihmës së tij (thanks to his help). It is a pattern worth learning as a whole.",
"“Paska” adds surprise or “apparently”: Paska ardhur! means “He has already come, I didn’t expect that!” It works like “qenka” in a similar situation.",
"“I paepur” means unyielding, someone who does not give in.",
"“Mërgim” means exile or living abroad as an emigrant, a very important word in Albanian culture."

var NEWQ={"0": [["Good evening in Albanian:", ["Mirëmbrëma", "Mirëmëngjes", "Natën e mirë", "Faleminderit"], null, "“Mirëmbrëma” is what you say in the evening (mbrëma = evening). “Mirëmëngjes” is for the morning and “Natën e mirë” is for going to bed."], ["“Po” means:", ["yes", "no", "please", "thank you"], null, "“Po” means yes and “jo” means no. Be careful, because “po” can look like “no” for English speakers."], ["“Ujë” means:", ["water", "bread", "milk", "coffee"], null, "“Ujë” is water. Bukë = bread, qumësht = milk, kafe = coffee."], ["Unë ___ student.", ["jam", "je", "është", "jemi"], null, "With “unë” (I) you say “jam”: unë jam student (I am a student). Ti je = you are, ai është = he is, ne jemi = we are."]], "1": [["Sa është dy plus tre?", ["pesë", "katër", "gjashtë", "shtatë"], null, "Dy (2) + tre (3) = pesë (5). Katër = 4, gjashtë = 6, shtatë = 7."], ["Ne ___ në shkollë çdo ditë.", ["shkojmë", "shkoj", "shkon", "shkojnë"], null, "With “ne” (we) the verb ends in -më: ne shkojmë (we go). Unë shkoj, ai shkon, ata shkojnë."], ["“Gjyshja ime” means:", ["my grandmother", "my sister", "my mother", "my aunt"], null, "“Gjyshe” is grandmother, “gjyshja” is “the grandmother” and “ime” means “my”. Motra = sister, nëna = mother, halla = aunt."]], "2": [["Nesër unë ___ një mik në qytet.", ["do të takoj", "takova", "kam takuar", "takoja"], null, "“Nesër” means tomorrow, so you need the future: “do të” + verb. Do të takoj = I will meet."], ["“Ku është stacioni?” means:", ["Where is the station?", "When is the train?", "How much is the ticket?", "What time is it?"], null, "“Ku” is where and “stacioni” is the station. Kur = when, sa = how much."], ["Më duhet të ___ herët nesër.", ["ngrihem", "ngrihesh", "ngrihet", "ngrihemi"], null, "After “më duhet të” (I have to) you use the form that matches “unë”: ngrihem (I get up). Ngrihesh = you get up, ngrihet = he gets up."]], "3": [["Synonym of “i vështirë”:", ["i ndërlikuar", "i lehtë", "i shpejtë", "i ftohtë"], null, "“I vështirë” means difficult, close to “i ndërlikuar” (complicated). “I lehtë” is the opposite (easy)."], ["Ky është libri ___ po flisja.", ["për të cilin", "të cilin", "i cili", "të cilët"], null, "You say “flas për” (I talk about), so the word “për” has to come before the pronoun: për të cilin (about which)."], ["Projekti u ___ me sukses nga ekipi.", ["përfundua", "përfundoj", "përfundon", "përfundova"], null, "“U përfundua” means “was finished”. “U” + the past form shows that something was done to the thing, here the project."]], "4": [["___ ishte i lodhur, ai vazhdoi të punonte.", ["Megjithëse", "Sepse", "Prandaj", "Nëse"], null, "“Megjithëse” means although. Sepse = because, prandaj = therefore, nëse = if."], ["“Ia dola mbanë” means:", ["I managed to do it", "I gave up", "I forgot", "I was late"], null, "“Ia dola mbanë” is an idiom meaning “I managed it / I succeeded”. You can’t translate it word by word."], ["“I pazëvendësueshëm” means:", ["irreplaceable", "unnecessary", "unusual", "impossible"], null, "“Pa-” means without and “zëvendësoj” means to replace, so “i pazëvendësueshëm” is irreplaceable."]], "5": [["“Rrëfim” is closest to:", ["a telling / account", "a punishment", "a journey", "an argument"], null, "“Rrëfim” comes from “rrëfej” (to tell, to confess). It means an account or story, and also confession."], ["“Ia mbylla gojën” means:", ["I silenced him", "I kissed him", "I fed him", "I called him"], null, "Literally “I closed his mouth”. It is an idiom meaning you made someone stop talking, or left them with nothing to say."], ["“Mikpritje” means:", ["hospitality", "loyalty", "bravery", "humour"], null, "“Mikpritje” is hospitality, “mik” is guest or friend and “pritje” is welcoming. It is one of the most important Albanian values."], ["“I pashembullt” means:", ["unprecedented", "ordinary", "expensive", "gentle"], null, "“Pa-” means without and “shembull” means example, so “i pashembullt” is without example: unprecedented, unmatched."]]};

var CP={"€":128,"‚":130,"„":132,"…":133,"‘":145,"’":146,"“":147,"”":148,"•":149,"–":150,"—":151};
function pdfEnc(t){
  var o="";
  for(var k=0;k<t.length;k++){var ch=t[k],c=t.charCodeAt(k);
    if(CP[ch])o+=String.fromCharCode(CP[ch]);
    else if(ch==="✓")o+="+";
    else if(ch==="✗")o+="x";
    else if(c<256)o+=ch;
    else{var base=ch.normalize("NFD")[0];o+=base.charCodeAt(0)<128?base:"?"}
  }
  return o.replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)");
}
function makePDF(blocks){
  var W=595,H=842,MX=54,MT=60,MB=56,pages=[[]],y=H-MT,cv=document.createElement("canvas").getContext("2d");
  var FONTS={r:["F1","Arial"],b:["F2","bold Arial"],i:["F3","italic Arial"]};
  function wrap(text,f,size,width){
    cv.font=(f==="b"?"bold ":f==="i"?"italic ":"")+size+"px Arial";
    var words=text.split(/\s+/),lines=[],cur="";
    words.forEach(function(w){var tr=cur?cur+" "+w:w;if(cv.measureText(tr).width>width&&cur){lines.push(cur);cur=w}else cur=tr});
    if(cur)lines.push(cur);return lines;
  }
  blocks.forEach(function(bk){
    var size=bk.size||10.5,lh=size*1.35,ind=bk.indent||0,lines=wrap(bk.text,bk.f||"r",size,W-2*MX-ind);
    y-=(bk.gap||0);
    if(y-lh<MB&&!bk.keep){pages.push([]);y=H-MT}
    // keep a whole short block together
    if(lines.length*lh>H-MT-MB){} else if(y-lines.length*lh<MB){pages.push([]);y=H-MT}
    lines.forEach(function(ln){
      if(y-lh<MB){pages.push([]);y=H-MT}
      var c=bk.color||[0.23,0.06,0.13];
      pages[pages.length-1].push("BT /"+FONTS[bk.f||"r"][0]+" "+size+" Tf "+c.join(" ")+" rg "+(MX+ind)+" "+y.toFixed(1)+" Td ("+pdfEnc(ln)+") Tj ET");
      y-=lh;
    });
  });
  var objs=[],n=0;
  function add(str){objs.push(str);return ++n}
  add("<< /Type /Catalog /Pages 2 0 R >>");           // 1
  add("");                                              // 2 (pages, filled later)
  add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");        // 3 F1
  add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");   // 4 F2
  add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique /Encoding /WinAnsiEncoding >>");// 5 F3
  var kids=[];
  pages.forEach(function(pg,pi){
    var foot="BT /F1 9 Tf 0.5 0.4 0.45 rg "+(W/2-20)+" 28 Td (Page "+(pi+1)+" of "+pages.length+") Tj ET";
    var st=pg.join("\n")+"\n"+foot;
    var cid=add("<< /Length "+st.length+" >>\nstream\n"+st+"\nendstream");
    var pid=add("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+W+" "+H+"] /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R >> >> /Contents "+cid+" 0 R >>");
    kids.push(pid+" 0 R");
  });
  objs[1]="<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+kids.length+" >>";
  var out="%PDF-1.4\n",offs=[];
  objs.forEach(function(o,k){offs.push(out.length);out+=(k+1)+" 0 obj\n"+o+"\nendobj\n"});
  var xr=out.length;
  out+="xref\n0 "+(objs.length+1)+"\n0000000000 65535 f \n"+offs.map(function(o){return ("0000000000"+o).slice(-10)+" 00000 n \n"}).join("")+"trailer\n<< /Size "+(objs.length+1)+" /Root 1 0 R >>\nstartxref\n"+xr+"\n%%EOF";
  var u=new Uint8Array(out.length);for(var k=0;k<out.length;k++)u[k]=out.charCodeAt(k)&255;
  return new Blob([u],{type:"application/pdf"});
}

    {text:"Estimated level: "+levelText+"   ·   Score: "+totalScore()+" / "+Q.length,f:"b",size:14,gap:12},
    {text:detail,size:10.5,color:dim,gap:2},
    {text:NOTES[levelText],gap:12},
    {text:profileText,gap:8},
    ].concat(badges.length?[{text:"Badges: "+badges.join(", "),f:"b",gap:10,color:green}]:[])
    .concat(wordsList.length?[{text:"Words to learn",f:"b",size:14,color:red,gap:16}].concat(wordsList.map(function(w){return {text:w[0]+" = "+w[1],indent:8,gap:2}})):[])
    .concat([
    {text:"Your answers and corrections",f:"b",size:14,color:red,gap:18}
  ]);
  answers.forEach(function(a,k){
    B.push({text:(k+1)+".  Level "+a.l+(a.ok?"   (correct)":(a.a===IDK?"   (I don’t know)":"   (not correct)")),f:"b",size:10.5,gap:12,color:a.ok?green:red});
    if(a.t)B.push({text:a.t,f:"i",size:10,indent:12,color:dim,gap:2});
    B.push({text:a.p,gap:2,indent:12});
    if(a.ok)B.push({text:"Your answer: "+a.a,indent:12,color:green,gap:1});
    else{
      B.push({text:"Your answer: "+a.a,indent:12,color:red,gap:1});
      B.push({text:"Correct answer: "+a.r,f:"b",indent:12,color:green,gap:1});
      B.push({text:a.e,f:"i",size:10,indent:12,color:dim,gap:2});
    }
  });
  return B;
}
function download(){
  var b=document.getElementById("pdf"),fn="albanian-test-"+name.replace(/[^\p{L}\p{N}.-]+/gu,"-")+".pdf";
  try{
    var url=URL.createObjectURL(makePDF(reportBlocks()));
    var a=document.createElement("a");a.href=url;a.download=fn;document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url)},2000);
    b.textContent="Downloaded. Download again";
  }catch(e){b.textContent="Download did not work. Please use Copy my result."}
}
// ---- text size and dark mode (remembered on this device when possible) ----
(function(){
  var root=document.documentElement,ts=document.getElementById("tsize"),tm=document.getElementById("tmode");
  function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function dark(){var md=root.getAttribute("data-mode");return md?md==="dark":(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)}
  function label(){tm.textContent=dark()?"Light mode":"Dark mode";ts.textContent=root.getAttribute("data-size")==="large"?"A–":"Aa"}
  var sm=get("mode"),sz=get("size");if(sm)root.setAttribute("data-mode",sm);if(sz)root.setAttribute("data-size",sz);
  ts.onclick=function(){var v=root.getAttribute("data-size")==="large"?"normal":"large";root.setAttribute("data-size",v);put("size",v);label()};
  tm.onclick=function(){var v=dark()?"light":"dark";root.setAttribute("data-mode",v);put("mode",v);label()};
  label();
})();
start();
</script>
